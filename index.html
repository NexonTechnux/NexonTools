<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GPU Stress Test - iPhone 4</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #111;
            overflow: hidden;
            color: #fff;
            font-family: sans-serif;
        }

        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1000;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            pointer-events: none;
        }

        /* La pallina: un incubo per le vecchie GPU a causa di box-shadow e gradienti */
        .ball {
            position: absolute;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: radial-gradient(circle, #ff0055, #770022);
            
            /* Il vero carico: le ombre pesanti forzano la GPU al "pixel blending" continuo */
            box-shadow: 0 0 15px 5px rgba(255, 0, 85, 0.8);
            opacity: 0.9;

            /* Forza l'accelerazione hardware (sperando che l'A4 la regga senza crashare) */
            -webkit-transform: translate3d(0,0,0);
            transform: translate3d(0,0,0);
        }
    </style>
</head>
<body>

    <div id="info">
        <strong>GPU Stress Test</strong><br>
        Palline: <span id="count">0</span><br>
        <small>iPhone 4 Hardware Killer</small>
    </div>

    <script>
        const BALL_COUNT = 150; // Numero di palline. Se l'iPhone 4 crasha, abbassa a 80.
        const balls = [];
        const screenWidth = window.innerWidth;
        const screenHeight = window.innerHeight;

        // Inizializza il contatore visivo
        document.getElementById('count').innerText = BALL_COUNT;

        // Creazione delle palline nel DOM
        for (let i = 0; i < BALL_COUNT; i++) {
            const el = document.createElement('div');
            el.className = 'ball';
            document.body.appendChild(el);

            balls.push({
                element: el,
                x: Math.random() * (screenWidth - 30),
                y: Math.random() * (screenHeight - 30),
                vx: (Math.random() - 0.5) * 8, // Velocità X
                vy: (Math.random() - 0.5) * 8  // Velocità Y
            });
        }

        // Loop di animazione (usa requestAnimationFrame, supportato da iOS 6+)
        function update() {
            for (let i = 0; i < BALL_COUNT; i++) {
                const b = balls[i];

                // Aggiorna posizione
                b.x += b.vx;
                b.y += b.vy;

                // Rimbalzo pareti laterali
                if (b.x <= 0 || b.x >= screenWidth - 30) {
                    b.vx *= -1;
                    b.x = b.x <= 0 ? 0 : screenWidth - 30;
                }

                // Rimbalzo soffitto/pavimento
                if (b.y <= 0 || b.y >= screenHeight - 30) {
                    b.vy *= -1;
                    b.y = b.y <= 0 ? 0 : screenHeight - 30;
                }

                // Applica il movimento usando translate3d per toccare la GPU
                b.element.style.webkitTransform = `translate3d(${b.x}px, ${b.y}px, 0)`;
                b.element.style.transform = `translate3d(${b.x}px, ${b.y}px, 0)`;
            }

            requestAnimationFrame(update);
        }

        // Fai partire il test
        requestAnimationFrame(update);
    </script>
</body>
</html>

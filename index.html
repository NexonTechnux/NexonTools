<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NexonTools Repo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #020617;
      border-radius: 12px;
      padding: 24px 28px;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 18px 40px rgba(0,0,0,0.6);
      border: 1px solid #1f2937;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.6rem;
    }
    p {
      margin: 6px 0 18px;
      font-size: 0.95rem;
      color: #9ca3af;
    }
    .btn {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 999px;
      background: #22c55e;
      color: #020617;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      border: none;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    .btn:hover {
      background: #16a34a;
      transform: translateY(-1px);
    }
    .url {
      margin-top: 14px;
      font-size: 0.8rem;
      color: #6b7280;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>NexonTools Repo</h1>
    <p>Tap the button below on your jailbroken device to add this repository to Cydia.</p>

    <!-- Cambia l’URL qui sotto se necessario -->
    <a class="btn" href="cydia://url/https://NexonTechnux.github.io/NexonTools/">
      Add repo to Cydia
    </a>

    <div class="url">
      Repo URL:<br>
      https://NexonTechnux.github.io/NexonTools/
    </div>
  </div>
</body>
</html>
